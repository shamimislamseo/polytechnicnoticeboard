<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইভেন্ট ক্যালেন্ডার | PNB</title><style>body{font-family:system-ui,sans-serif;background:#f2f7fb;color:#17263b}.wrap{max-width:850px;margin:30px auto;background:white;padding:26px;border-radius:15px}input{padding:10px;border:1px solid #ccd8e5;border-radius:8px}
/* PNB motion system: subtle, accessible animations */
@keyframes pnbFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pnbSoftPulse{0%,100%{box-shadow:0 0 0 0 #18a9d233}50%{box-shadow:0 0 0 7px #18a9d200}}
@keyframes pnbTicker{0%{transform:translateX(8%)}100%{transform:translateX(-8%)}}
.pnb-reveal{animation:pnbFadeUp .65s ease both}
.card,.side-item,.hero-main,.head,.item,.box{transition:transform .25s ease,box-shadow .25s ease}
.card:hover,.side-item:hover,.item:hover{transform:translateY(-5px);box-shadow:0 14px 32px #123b5b18}
.hero-main img{transition:transform 1.1s ease}
.hero-main:hover img{transform:scale(1.045)}
.ticker b{animation:pnbSoftPulse 2.8s ease-in-out infinite}
button,.btn,a.card{transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease}
button:active,.btn:active{transform:scale(.97)}
:focus-visible{outline:3px solid #18a9d2;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><a href="features.html">← শিক্ষার্থী সেবা</a><h1>📅 PNB ইভেন্ট ক্যালেন্ডার</h1><p>পরীক্ষা, ভর্তি, সেমিনার ও ক্যাম্পাস ইভেন্টের তারিখ এখানে সাজানো যাবে।</p><label>তারিখ খুঁজুন: <input type="date" id="d"></label><p id="msg">এখনো কোনো যাচাইকৃত ইভেন্ট যোগ করা হয়নি।</p><p>ইভেন্ট যোগ করার সময় আয়োজক, স্থান, সময়, নিবন্ধন লিংক ও তথ্যসূত্র উল্লেখ করতে হবে।</p><script>document.getElementById('d').onchange=e=>document.getElementById('msg').textContent='নির্বাচিত তারিখ: '+e.target.value+' — ইভেন্ট ডেটাবেস যুক্ত হলে ফলাফল দেখাবে।';</script></main><script>(()=>{const els=document.querySelectorAll('main h1,main h2,main .card,main .item,main .box,main .grid');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('pnb-reveal'));return;}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('pnb-reveal');io.unobserve(e.target)}}),{threshold:.08});els.forEach(e=>io.observe(e));})();</script></body></html>
