<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইভেন্ট ক্যালেন্ডার | PNB</title><style>body{font-family:system-ui,sans-serif;background:#f2f7fb;color:#17263b}.wrap{max-width:850px;margin:30px auto;background:white;padding:26px;border-radius:15px}input{padding:10px;border:1px solid #ccd8e5;border-radius:8px}</style></head><body><main class="wrap"><a href="features.html">← শিক্ষার্থী সেবা</a><h1>📅 PNB ইভেন্ট ক্যালেন্ডার</h1><p>পরীক্ষা, ভর্তি, সেমিনার ও ক্যাম্পাস ইভেন্টের তারিখ এখানে সাজানো যাবে।</p><label>তারিখ খুঁজুন: <input type="date" id="d"></label><p id="msg">এখনো কোনো যাচাইকৃত ইভেন্ট যোগ করা হয়নি।</p><p>ইভেন্ট যোগ করার সময় আয়োজক, স্থান, সময়, নিবন্ধন লিংক ও তথ্যসূত্র উল্লেখ করতে হবে।</p><script>document.getElementById('d').onchange=e=>document.getElementById('msg').textContent='নির্বাচিত তারিখ: '+e.target.value+' — ইভেন্ট ডেটাবেস যুক্ত হলে ফলাফল দেখাবে।';</script></main></body></html>
