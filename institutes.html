<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইনস্টিটিউট ডিরেক্টরি | PNB</title><style>body{font-family:system-ui,sans-serif;background:#f2f7fb;color:#17263b;margin:0}.wrap{max-width:850px;margin:30px auto;padding:24px;background:white;border-radius:15px}input,select{padding:12px;border:1px solid #ccd8e5;border-radius:8px;margin:5px;max-width:100%}.note{background:#fff7df;padding:14px;border-radius:9px}</style></head><body><main class="wrap"><a href="features.html">← শিক্ষার্থী সেবা</a><h1>🏫 পলিটেকনিক ইনস্টিটিউট ডিরেক্টরি</h1><p>প্রতিষ্ঠানের তথ্য যাচাই করে ধাপে ধাপে যুক্ত করা হবে। আপাতত অনুসন্ধানের কাঠামো প্রস্তুত।</p><input id="q" placeholder="ইনস্টিটিউটের নাম লিখুন"><select id="type"><option value="">সব ধরন</option><option>সরকারি</option><option>বেসরকারি</option></select><div id="out" class="note">এখনো যাচাইকৃত ইনস্টিটিউট ডেটাবেস যুক্ত হয়নি।</div><p class="note">প্রতিষ্ঠানের নাম, ঠিকানা, ওয়েবসাইট ও যোগাযোগ নম্বর যাচাই ছাড়া প্রকাশ করা হবে না।</p><script>document.getElementById('q').addEventListener('input',()=>document.getElementById('out').textContent='ইনস্টিটিউট ডেটাবেস যুক্ত হলে “'+document.getElementById('q').value+'” অনুসন্ধান করা যাবে।');</script></main></body></html>
