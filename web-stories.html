<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092d4e"><meta name="description" content="পলিটেকনিক নোটিশ বোর্ডের সংক্ষিপ্ত ভিজ্যুয়াল ওয়েব স্টোরি।"><title>ওয়েব স্টোরি | PNB</title><link rel="icon" href="icons/pnb-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="pnb-redesign.css?v=1"><style>
.story-page{width:min(1100px,calc(100% - 28px));margin:28px auto 60px}.story-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 0}.story-heading h1{margin:0;color:var(--navy)}.story-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.story-tile{min-height:300px;border-radius:20px;padding:20px;color:white;background:linear-gradient(155deg,var(--story-bg),#071f36);display:flex;flex-direction:column;justify-content:space-between;border:4px solid white;outline:1px solid var(--line);box-shadow:var(--shadow)}.story-tile h2{font-size:24px;line-height:1.35}.story-tile a{color:white;font-weight:700}.story-view{max-width:430px;margin:20px auto;background:#0a2540;border-radius:24px;padding:8px;color:white;box-shadow:0 16px 50px #061b3440}.story-progress{display:flex;gap:4px;margin:7px}.story-progress span{height:3px;background:#ffffff65;flex:1;border-radius:4px}.story-progress span.active{background:white}.story-slide{min-height:570px;padding:26px 23px;display:flex;flex-direction:column;justify-content:space-between;border-radius:18px;background:linear-gradient(155deg,var(--slide-bg,#075ca8),#071f36)}.story-slide h1{font-size:34px;line-height:1.25}.story-slide p{font-size:19px;line-height:1.6}.story-controls{display:flex;justify-content:space-between;gap:10px;padding:12px}.story-controls button{background:#fff;color:#092d4e;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.story-back{display:inline-block;color:var(--blue);font-weight:700;margin-bottom:12px}.story-empty{padding:35px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:18px;color:var(--muted);grid-column:1/-1}
@media(max-width:800px){.story-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.story-list{grid-template-columns:1fr 1fr;gap:10px}.story-tile{min-height:230px;padding:14px}.story-tile h2{font-size:18px}.story-slide{min-height:68vh}.story-slide h1{font-size:29px}}
</style></head><body><div class="pnb-topline"><div class="pnb-wrap"><span>পলিটেকনিক শিক্ষার্থীদের তথ্যকেন্দ্র</span><span>PNB Web Stories</span></div></div><header class="pnb-header"><div class="pnb-wrap pnb-headrow"><a class="pnb-brand" href="./"><img src="icons/pnb-logo.svg" alt="PNB"><span><strong>পলিটেকনিক নোটিশ বোর্ড</strong><small>Web Stories</small></span></a><a class="pnb-btn" href="./">হোমে ফিরুন</a></div></header><main class="story-page"><a class="story-back" href="./">← হোম</a><div class="story-heading"><div><h1 id="pageTitle">PNB ওয়েব স্টোরি</h1><p>সংক্ষিপ্ত ভিজ্যুয়াল আপডেট</p></div></div><div id="storyRoot" class="story-list"><div class="story-empty">ওয়েব স্টোরি লোড হচ্ছে...</div></div></main><footer class="pnb-footer"><div class="pnb-wrap"><p>© পলিটেকনিক নোটিশ বোর্ড (PNB)</p><p><a href="https://www.facebook.com/AllPolytechnicInstitute">Facebook</a> · <a href="https://www.instagram.com/polytechnicnoticeboard">Instagram</a> · <a href="https://t.me/pnb2018">Telegram</a></p></div></footer><script src="pnb-data.js"></script><script>
(()=>{'use strict';const root=document.getElementById('storyRoot');const stories=(window.PNB_STORIES||[]).filter(s=>s.published===true);const id=new URLSearchParams(location.search).get('story');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(id){const story=stories.find(s=>s.id===id);if(!story){root.className='story-list';root.innerHTML='<div class="story-empty">এই ওয়েব স্টোরিটি পাওয়া যায়নি অথবা এখনো প্রকাশিত হয়নি।</div>';return;}document.getElementById('pageTitle').textContent=story.title;root.className='';let n=0;function draw(){const slides=story.slides||[];const s=slides[n];root.innerHTML='<section class="story-view"><div class="story-progress">'+slides.map((_,i)=>'<span class="'+(i===n?'active':'')+'"></span>').join('')+'</div><article class="story-slide" style="--slide-bg:'+esc(s.color||story.color||'#075ca8')+'"><small>PNB WEB STORY · '+(n+1)+'/'+slides.length+'</small><div><h1>'+esc(s.heading||story.title)+'</h1><p>'+esc(s.text||'')+'</p></div><small>© পলিটেকনিক নোটিশ বোর্ড</small></article><div class="story-controls"><button id="prev" '+(n===0?'disabled':'')+'>আগের</button><button id="next">'+(n===slides.length-1?'শেষ':'পরের')+'</button></div></section>' ;document.getElementById('prev').onclick=()=>{if(n>0){n--;draw()}};document.getElementById('next').onclick=()=>{if(n<slides.length-1){n++;draw()}else location.href='web-stories.html';};}draw();}else{root.className='story-list';root.innerHTML=stories.length?stories.map(s=>'<article class="story-tile" style="--story-bg:'+esc(s.color||'#075ca8')+'"><small>PNB WEB STORY</small><h2>'+esc(s.title)+'</h2><a href="web-stories.html?story='+encodeURIComponent(s.id)+'">স্টোরি দেখুন →</a></article>').join(''):'<div class="story-empty">এখনো কোনো ওয়েব স্টোরি প্রকাশিত হয়নি। যাচাইকৃত কনটেন্ট যোগ হলে এখানে স্টোরি দেখা যাবে।</div>';}})();
</script><script src="pnb-social.js"></script></body></html>
