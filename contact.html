<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="জনবার্তার সঙ্গে যোগাযোগ করুন।"><title>যোগাযোগ | জনবার্তা</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f6f8;color:#171923;line-height:1.7}.wrap{max-width:700px;margin:40px auto;padding:28px;background:#fff;border-radius:16px}h1{color:#c8102e}label{display:block;font-weight:700;margin-top:14px}input,textarea{width:100%;padding:12px;border:1px solid #d9dce3;border-radius:9px;font:inherit;box-sizing:border-box}textarea{min-height:140px}button{margin-top:15px;padding:11px 17px;border:0;border-radius:9px;background:#c8102e;color:#fff;font-weight:700;cursor:pointer}.notice{background:#fff4e5;padding:12px;border-radius:8px;font-size:14px}a{color:#c8102e}</style></head><body><main class="wrap"><a href="./">← হোমপেজ</a><h1>যোগাযোগ</h1><p class="notice">এই ফর্মটি এখন ডেমো; বার্তা কোথাও পাঠানো হবে না। বাস্তবে চালু করতে নিরাপদ backend বা form service সংযুক্ত করতে হবে।</p><form id="contactForm"><label for="name">আপনার নাম</label><input id="name" required maxlength="100"><label for="email">ইমেইল</label><input id="email" type="email" required maxlength="200"><label for="message">বার্তা</label><textarea id="message" required maxlength="3000"></textarea><button type="submit">বার্তা পাঠানোর ডেমো</button><p id="result" aria-live="polite"></p></form></main><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent='ডেমো ফর্ম পরীক্ষা হয়েছে; বার্তা পাঠানো হয়নি। ফর্মটি প্রকাশের আগে backend যুক্ত করুন।';e.target.reset()});</script></body></html>
