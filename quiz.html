<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNB Quiz</title><style>body{font-family:system-ui,sans-serif;background:#f2f7fb;color:#17263b;margin:0}.box{max-width:720px;margin:35px auto;background:white;padding:24px;border-radius:16px}.btn{padding:10px 16px;border:0;border-radius:8px;background:#0759a8;color:white;cursor:pointer;margin:5px}button.opt{display:block;width:100%;text-align:left;background:#eef5fb;color:#17263b}.muted{color:#64748b}</style></head><body><main class="box"><a href="features.html">← শিক্ষার্থী সেবা</a><h1>🧠 পলিটেকনিক কুইজ</h1><p class="muted">এটি অনুশীলনের নমুনা কুইজ; পরীক্ষার প্রশ্নব্যাংক নয়।</p><div id="quiz"></div><script>const qs=[{q:"SI পদ্ধতিতে দৈর্ঘ্যের একক কোনটি?",o:["মিটার","লিটার","সেকেন্ড","কিলোগ্রাম"],a:0},{q:"কম্পিউটারের CPU-কে সাধারণত কী বলা হয়?",o:["মনিটর","প্রসেসর","মাউস","প্রিন্টার"],a:1},{q:"বৈদ্যুতিক প্রবাহের একক কী?",o:["ভোল্ট","ওহম","অ্যাম্পিয়ার","ওয়াট"],a:2},{q:"AutoCAD প্রধানত কোন কাজে ব্যবহৃত হয়?",o:["ড্রাফটিং ও ডিজাইন","ভিডিও কল","অডিও রেকর্ড","ওয়েব ব্রাউজিং"],a:0}];let i=0,score=0;function draw(){let q=qs[i];document.getElementById('quiz').innerHTML='<h3>প্রশ্ন '+(i+1)+'/'+qs.length+'</h3><h2>'+q.q+'</h2>'+q.o.map((x,n)=>'<button class="btn opt" data-n="'+n+'">'+x+'</button>').join('')+'<p id="msg"></p>';document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(+b.dataset.n===q.a)score++;i++;if(i<qs.length)draw();else document.getElementById('quiz').innerHTML='<h2>কুইজ সম্পন্ন!</h2><p>সঠিক উত্তর: '+score+'/'+qs.length+'</p><button class="btn" onclick="location.reload()">আবার চেষ্টা করুন</button>'})}draw();</script></main></body></html>
